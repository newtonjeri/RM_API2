# Test Sequence 3 — SEQUENCE 2, INTERPOLATED. Same path, more waypoints.
#
# Every point inserted below lies EXACTLY on a segment of sequence 2
# (checked to 1e-4 m), so the geometry the arm traces is unchanged — only
# the number of waypoints along it. Sequence 2's Y strokes ran row 1 to
# row 5 in one move, past three existing points each; those points are now
# commanded.
#
# The diagonals get nothing inserted, and that is correct rather than an
# omission: no point in the file lies on them. Inserting the nearest
# point instead would bend a straight move into a staircase.
