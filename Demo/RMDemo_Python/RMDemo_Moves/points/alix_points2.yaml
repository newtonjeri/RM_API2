# ==========================================================================
# alix moves points — rm_pose_t, 9 x 5 grid
# ==========================================================================
# EVERY pose is rm_pose_t: [x, y, z, rx, ry, rz], METRES and RADIANS,
# R = Rz.Ry.Rx, in the RIGHT arm's frame at pole minimum. Dispatched
# exactly as written.
#
# GENERATED from alix_points.yaml by interpolating along X: that file is
# a 3 x 5 grid, and each of its two X intervals is subdivided into 4,
# so the three measured columns land on columns 0, 4 and 8 here and
# are reproduced EXACTLY. Nothing measured has been moved.
#
# POSITIONS are linear in x, y AND z — the third column drifts a few mm
# in y and z off its row, so all three are carried, not just x.
#
# ROTATIONS ARE SLERPED, not angle-interpolated. The three Euler angles
# are a chart, not a vector space: a straight line through them is a
# curved, non-uniform path through orientation, and near a wrap it is
# wildly wrong. Each pose is converted to a quaternion, interpolated
# along the shortest arc at constant angular rate, and converted back.
# It matters here — along a row the first two columns share one
# orientation and the third tilts by up to 18 deg.
#
# Naming is row-major: point1..point9 are row 1 (largest y),
# point10..point18 row 2, and so on. start_pose is point41.
# ==========================================================================

arm_model: RM_75

# WHICH ARM THESE POINTS BELONG TO — not a preference. Each arm has its
# own base frame, so these poses name a different place on the left arm.
side: right

rest_pose:
  right: [0, -82, -26, 98, 6, 62, 69]
  left:  [0, -82, 26, 98, -6, 62, 111]

