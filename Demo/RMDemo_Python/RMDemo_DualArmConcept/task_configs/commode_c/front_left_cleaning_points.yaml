# =============================================================================
# STAGE SEQUENCE
# =============================================================================
# Defines execution order for front exterior surface using the left arm
stage_sequence:
  - stage: setup_washroom_scene
    conditional: true
    condition_param: enable_washroom_scene

  - stage: current_state

  - stage: hand_grasp
    pose_name: grasp
    planning_group: inspire_hand_left

  - stage: move_pole_to_minimum
    pose_name: minimum_length
    planning_group: pole_left

  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_left

  # right pole to full length
  - stage: move_pole_to_max_height
    pose_name: full_length
    planning_group: pole_right

  # right arm to rest pose
  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_right

  - stage: move_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_left
    conditional: true
    condition_param: use_prestart_stage

  - stage: allow_collision
    contact_surface: all

  - stage: move_to_start
    pose_name: start_pose
    planning_group: rm75_arm_left

  - stage: open_tenth
    pose_name: open_tenth
    planning_group: inspire_hand_left

  - stage: execute_path

  - stage: hand_grasp
    pose_name: grasp
    planning_group: inspire_hand_left

  - stage: forbid_collision
    contact_surface: all

  - stage: move_to_retract
    pose_name: retract
    planning_group: rm75_arm_left

  - stage: move_pole_to_half_height
    pose_name: half_length
    planning_group: pole_left

  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_left
    
