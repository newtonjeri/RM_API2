# =============================================================================
# STAGE SEQUENCE
# =============================================================================
# Defines execution order for seat ring underside using the left arm
stage_sequence:
  - stage: setup_washroom_scene
    conditional: true
    condition_param: enable_washroom_scene

  - stage: current_state

  - stage: hand_release
    pose_name: release
    planning_group: inspire_hand_left

  - stage: move_pole_to_half_height
    pose_name: half_length
    planning_group: pole_left

  - stage: hand_grasp
    pose_name: grasp
    planning_group: inspire_hand_left

  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_left

  - stage: move_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_left
    conditional: true
    condition_param: use_prestart_stage

  - stage: allow_collision
    contact_surface: seat
    
  - stage: move_to_start
    pose_name: start_pose
    planning_group: rm75_arm_left

  - stage: open_tenth
    pose_name: open_tenth
    planning_group: inspire_hand_left

  - stage: execute_path

  - stage: move_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_left
    conditional: true
    condition_param: use_prestart_stage

  - stage: forbid_collision
    contact_surface: seat

  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_left
    
  - stage: move_pole_to_half_height
    pose_name: half_length
    planning_group: pole_left
