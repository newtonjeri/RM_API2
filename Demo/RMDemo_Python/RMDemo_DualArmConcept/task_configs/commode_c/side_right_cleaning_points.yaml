# =============================================================================
# SIDE (LID SIDE EDGES + BODY SIDE) CLEANING TASK CONFIGURATION (Right Arm)
# =============================================================================
# Generated by cleaning_path_gen for fixture: commode_c
# Region: side - Lid side edges + Side (body) (merged task)
# Component: lid + body
# Articulation: side: lid closed (0.000 deg), body static
# Orientation reference: start_pose
# Surface type: double_curved + double_curved
# Source STL: /home/newtonjeri/butterfli_ws/src/butterfli-ai-ros-jazzy/cleaning_tasks/config/commode_cleaning/commode_c/models/lid_regions.obj + body_regions.obj
# Cleaning point translations are start_pose-origin deltas in butterfli_ref_frame axes.
# Cleaning point rotations are Euler RPY deltas (degrees); runtime resolves as R_final = R_delta * R_start_pose.
#
# MERGED TASK: former lid_side_right region (points 1-12, cleaned first)
# followed by former side_right region (points 13-27, former point N = N+12).
# start_pose is the former lid_side start_pose. Side points were re-expressed
# relative to it from the old side start_pose
# [0.7, -0.06, -0.11, 0.6842, 0.7133, 0.1134, 0.1017]:
#   translation += [-0.0065, -0.01, -0.013]
#   rotation delta composed with R_side_start * R_start_pose^-1 (XYZ ~[3.6, -12.3, 9.9] deg)
# so every point resolves to the same butterfli_ref_frame pose as before the merge.
# max_jerk_scaling unified to 0.3 (former side value; lid_side ran at 0.5).
# waypoint_reduction_mode + dp tolerances carried over from the former side task.
# Old lid_side row-2 commented-out sequences were dropped (their point names
# would collide with the renumbered side points).
# =============================================================================

# =============================================================================
# TASK PARAMETERS
# =============================================================================
task_parameters:
  use_prestart_stage: true
  commode_fixture_type: closed
  enable_washroom_structure: true
  ik_frame: R_glove_frame_1
  cleaning_path_mode: ruckig_pro_only
  # DECLARED = ACTUAL (corrected 2026-07-31). This read `dp_and_linear` with both
  # tolerances commented out. They default to 0.0 (config_loader.hpp:288-289), and
  # applySmoothing REQUIRES both > 0 for any dp mode, so every generation logged
  #   "waypoint_reduction_mode='dp_and_linear' requires dp_pos_tolerance > 0 and
  #    dp_rot_tolerance > 0 (got 0.000000 m, 0.000000 rad). Falling back to linear
  #    subsampling (step=1)."
  # and kept 699 of 699 intermediates. The D-P half was never doing anything.
  #
  # Set to `linear` because that is BIT-IDENTICAL to what was already running: the
  # dp-fallback branch and the linear branch execute the same loop
  # (ruckig_pro_smoothing.cpp:614-615 vs :674-675). This changes no motion — it
  # removes a WARN on every plan generation that would otherwise mask real ones.
  #
  # TO RESTORE D-P (deliberate change, needs measurement — do NOT just uncomment):
  #   set waypoint_reduction_mode: dp_and_linear AND dp_pos_tolerance: 0.001,
  #   dp_rot_tolerance: 0.0017, then compare against the 31 Jul baseline on:
  #     - via count (699 today; D-P will cut it, and Ruckig Pro's
  #       intermediate_positions are designed for O(10-100), not thousands)
  #     - median section time, which drives the jerk-acceleration coupling —
  #       sparser vias lower the required jerk and change the acceleration cap
  #     - EEF path deviation between vias (Resource/scripts/path_deviation.py):
  #       fewer hard pass-through constraints give Ruckig more freedom to bow
  #   The current plans were hardware-validated on 31 Jul at 2.17 deg peak tracking;
  #   that validation does not carry across a via-reduction change.
  waypoint_reduction_mode: linear
  waypoint_step: 1
  max_velocity_scaling: 1
  max_jerk_scaling: 0.3
  max_acceleration_scaling: 1

