  # start_pose: [0.70645, -0.052908, -0.097136, 0.74677, 0.66327, 0.013633, 0.047203]
  # start_pose: [0.70645, -0.06, -0.082, 0.74677, 0.66327, 0.013633, 0.047203]
  # start_pose: [0.7065, -0.055, -0.087, 0.7468, 0.6633, 0.0136, 0.0472]
  start_pose: [0.7065, -0.05, -0.097, 0.7468, 0.6633, 0.0136, 0.0472]
