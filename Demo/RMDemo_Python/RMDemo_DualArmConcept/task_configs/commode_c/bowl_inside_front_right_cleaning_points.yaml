# =============================================================================
# STAGE SEQUENCE
# =============================================================================
# Defines execution order for bowl interior front section using the right arm
stage_sequence:
  - stage: setup_washroom_scene
    conditional: true
    condition_param: enable_washroom_scene

  - stage: current_state

  - stage: move_pole_to_quarter_height
    pose_name: quarter_length
    planning_group: pole_right

  - stage: hand_grasp
    pose_name: grasp
    planning_group: inspire_hand_right

  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_right

  - stage: move_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_right
    conditional: true
    condition_param: use_prestart_stage

  - stage: allow_collision
    contact_surface: body
    additional_ik_frames: ["R_glove_frame_2", "R_glove_frame_3"]
    collisions:
      - [IRH_right_thumb_2, commode_body]
      - [IRH_right_thumb_3, commode_body]

  - stage: open_tenth
    pose_name: open_tenth
    planning_group: inspire_hand_right

  - stage: move_to_start
    pose_name: start_pose
    planning_group: rm75_arm_right

  - stage: execute_path

  - stage: return_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_right
    conditional: true
    condition_param: use_prestart_stage
    
  - stage: forbid_collision
    contact_surface: body
    additional_ik_frames: ["R_glove_frame_2", "R_glove_frame_3"]
    collisions:
      - [IRH_right_thumb_2, commode_body]
      - [IRH_right_thumb_3, commode_body]

  # TAIL (session order 2026-07-29): this is the LAST right-arm cleaning row —
  # glove remove follows immediately, so the task parks EXACTLY where
  # glove_remove_right starts: arm at REST, pole at QUARTER_LENGTH (the height
  # its first pole stage commands). Previously ended ready + full_length,
  # which cost glove remove a full pole stroke and an arm swing.
  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_right

  - stage: hand_grasp
    pose_name: grasp
    planning_group: inspire_hand_right

  - stage: move_pole_to_quarter_height
    pose_name: quarter_length
    planning_group: pole_right