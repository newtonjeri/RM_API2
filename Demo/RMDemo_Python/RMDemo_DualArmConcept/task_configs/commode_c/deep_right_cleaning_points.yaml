# =============================================================================
# STAGE SEQUENCE
# =============================================================================
# Defines execution order for deep bowl cleaning (ring + back wall) using the right arm
stage_sequence:
  - stage: setup_washroom_scene
    conditional: true
    condition_param: enable_washroom_scene
  - stage: current_state
  - stage: move_pole_to_quarter_height
    pose_name: quarter_length
    planning_group: pole_right
  - stage: hand_grasp
    pose_name: grasp
    planning_group: inspire_hand_right
  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_right
  - stage: move_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_right
    conditional: true
    condition_param: use_prestart_stage
  - stage: allow_collision
    contact_surface: body
  - stage: open_tenth
    pose_name: open_tenth
    planning_group: inspire_hand_right
  - stage: move_to_start
    pose_name: start_pose
    planning_group: rm75_arm_right
  - stage: execute_path
  - stage: return_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_right
    conditional: true
    condition_param: use_prestart_stage
  - stage: forbid_collision
    contact_surface: body
  - stage: move_to_ready
    pose_name: ready
    planning_group: rm75_arm_right
  - stage: move_pole_to_max_height
    pose_name: full_length
    planning_group: pole_right
  - stage: hand_grasp
    pose_name: release
    planning_group: inspire_hand_right
