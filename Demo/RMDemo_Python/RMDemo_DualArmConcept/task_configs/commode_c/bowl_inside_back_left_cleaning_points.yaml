# =============================================================================
# TASK PARAMETERS
# =============================================================================
task_parameters:
  use_prestart_stage: true
  commode_fixture_type: lid_seat_open
  ik_frame: L_glove_frame_2
  cleaning_path_mode: ruckig_pro_only
  max_velocity_scaling: 1
  max_jerk_scaling: 0.5
  max_acceleration_scaling: 1

