# =============================================================================
# STAGE SEQUENCE
# =============================================================================
# Defines execution order for bowl interior back section using the left arm
stage_sequence:
  - stage: setup_washroom_scene
    conditional: true
    condition_param: enable_washroom_scene

  - stage: current_state

  - stage: move_pole_to_quarter_height
    pose_name: quarter_length
    planning_group: pole_left

  - stage: hand_grasp
    pose_name: grasp
    planning_group: inspire_hand_left

  - stage: move_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_left
    conditional: true
    condition_param: use_prestart_stage

  - stage: allow_collision
    contact_surface: body

  - stage: open_tenth
    pose_name: open_tenth
    planning_group: inspire_hand_left
    
  - stage: move_to_start
    pose_name: start_pose
    planning_group: rm75_arm_left

  - stage: execute_path

  - stage: return_to_pre_start
    pose_name: pre_start_pose
    planning_group: rm75_arm_left
    conditional: true
    condition_param: use_prestart_stage

  - stage: move_to_retract
    pose_name: retract_pose
    planning_group: rm75_arm_left

  - stage: forbid_collision
    contact_surface: body

  # TAIL (session order 2026-07-29): last left-arm cleaning row — park where
  # glove removal starts: arm at REST, pole at QUARTER_LENGTH (glove_remove
  # commands quarter_length as its first pole stage). Previously full_length,
  # which cost the remove phase a full pole stroke.
  - stage: move_to_rest
    pose_name: rest_pose
    planning_group: rm75_arm_left

  - stage: move_pole_to_quarter_height
    pose_name: quarter_length
    planning_group: pole_left

  - stage: hand_grasp
    pose_name: release
    planning_group: inspire_hand_left

  - stage: thumb_grasp
    pose_name: thumb_grasp
    planning_group: inspire_hand_left
