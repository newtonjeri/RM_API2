# =============================================================================
# STAGE SEQUENCE
# Defines the execution order of stages for the bottom lid cleaning task
# =============================================================================
stage_sequence:
  # 1. Setup washroom collision scene
  - stage: "setup_washroom_scene"
    conditional: true
    condition_param: "enable_washroom_scene"

  # 2. Initialize with current state
  - stage: "current_state"

  # 3. Move pole to quarter height for cleaning
  # - stage: "move_pole_to_quarter_height"
  #   pose_name: "quarter_length"
  #   planning_group: "pole_left"

  - stage: "move_pole_to_half_height"
    pose_name: "half_length"
    planning_group: "pole_left"

  # 4. Close hand to grasp cleaning tool
  - stage: "hand_grasp"
    pose_name: "grasp"
    planning_group: "inspire_hand_left"

  # 5. Move to pre-start pose
  - stage: "move_to_pre_start"
    pose_name: "pre_start_pose"
    planning_group: "rm75_arm_left"
    conditional: true
    condition_param: "use_prestart_stage"

  - stage: "allow_collision"
    contact_surface: seat_and_lid
  - stage: "move_to_start"
    pose_name: "start_pose"
    planning_group: "rm75_arm_left"

  # Hand onetenth grasp to allow collisions with commode lid
  - stage: "open_tenth"
    pose_name: "open_tenth"
    planning_group: "inspire_hand_left"

  # 7. Execute cleaning path with 6DOF trajectory
  - stage: "execute_path"
    # trajectory_mode: 1
    # radio: 60

  # Move to pre-start pose
  # - stage: "move_to_pre_start"
  #   pose_name: "pre_start_pose"
  #   planning_group: "rm75_arm_left"
  #   conditional: true
  #   condition_param: "use_prestart_stage"
  # 8. Return to ready/home position

  - stage: "move_to_rest"
    pose_name: "rest_pose"
    planning_group: "rm75_arm_left"

  - stage: "forbid_collision"
    contact_surface: seat_and_lid
  - stage: "hand_release"
    pose_name: "release"
    planning_group: "inspire_hand_left"
