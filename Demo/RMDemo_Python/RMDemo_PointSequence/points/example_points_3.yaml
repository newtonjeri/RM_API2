# =============================================================================
# CARTESIAN POSES (Position + Orientation)
# =============================================================================
# Format: [x, y, z, rx, ry, rz] — metres and RADIANS (rm_pose_t, R = Rz.Ry.Rx), all poses in arm_world at pole half_length.
# pre_start_pose is DERIVED: start_pose backed off along the glove frame's
# press normal (constants.PRE_START_RETRACT_M, clamped 20-70 mm and kept
# clear of the pad's own compliance). Declare pre_start_retract_m on the
# region to change it; do not hand-edit it back onto the surface.
cartesian_poses:
  start_pose: [0.63618352, -0.038476499, -0.402499889, -3.121151054, 0.278084253, -1.819373399]
  pre_start_pose: [0.63618352, -0.096776499, -0.318799889, -3.121151054, 0.278084253, -1.819373399]

# =============================================================================
# CLEANING POINTS (Absolute pose per point)
# =============================================================================
# ABSOLUTE poses in arm_world at pole half_length — NOT offsets from start_pose.
# Encoding: translation [x, y, z] in metres, rotation [r, p, y] in DEGREES (intrinsic XYZ).
# SAME keys and units as a delta file: task_parameters.point_form
# is the ONLY thing that tells the two apart, and a reader that
# assumes deltas would place every point near the frame origin.
